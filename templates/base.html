<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}阎良甜瓜数据看板{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
  <script>
    if (typeof echarts === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        阎良甜瓜数据看板
        <small>Flask + ECharts</small>
      </div>
      <nav class="nav">
        <a href="/" class="{{ 'on' if active == 'index' }}">产业概览</a>
        <a href="/platform" class="{{ 'on' if active == 'platform' }}">平台对比</a>
        <a href="/spec" class="{{ 'on' if active == 'spec' }}">规格价格</a>
        <a href="/variety" class="{{ 'on' if active == 'variety' }}">品种分析</a>
        <a href="/sentiment" class="{{ 'on' if active == 'sentiment' }}">评论情感</a>
        <a href="/export" class="{{ 'on' if active == 'export' }}">数据导出</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    阎良甜瓜电商监测 · 数据看板原型 · 数据来源：本地 CSV（data/ 与 artifacts/outputs/tables/）
  </footer>

  <script>
    function chartOf(id) {
      var el = document.getElementById(id);
      if (!el) return null;
      return echarts.init(el, null, { renderer: 'canvas' });
    }

    function getJSON(url) {
      return fetch(url, { headers: { 'Accept': 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }

    function showBoxError(id, msg) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = '<div class="chart-error">' + (msg || '数据加载失败') + '</div>';
    }

    var resizeHandlers = [];
    function onResize(fn) { resizeHandlers.push(fn); }
    window.addEventListener('resize', function () {
      resizeHandlers.forEach(function (fn) { try { fn(); } catch (e) {} });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
